<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hadrius Studio Beta</title>
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header><img src="icons/wordmark.png" class="wordmark" alt="Hadrius Studio"><span class="beta-badge">Beta</span><span id="bridgeDot" class="dot"></span></header>
  <nav><button class="tab active" data-view="recording">Recording <span id="stepCount" hidden></span></button><button class="tab" data-view="workflows">Workflows</button></nav>

  <div id="statusBarContainer" class="top-status-container">
    <div id="recordingBanner" class="top-banner recording-banner" hidden>
      <span class="pulse-dot"></span>
      <div class="banner-text-group">
        <span class="banner-title">RECORDING LIVE</span>
        <span id="recordingStepIndicator" class="banner-detail">0 steps</span>
      </div>
      <div class="banner-actions">
        <button id="bannerStopBtn" class="banner-btn banner-btn-stop" type="button" title="Stop recording and draft AI narration">■ Stop & draft</button>
        <button id="bannerCancelBtn" class="banner-btn banner-btn-cancel" type="button" title="Cancel recording without drafting">✕ Cancel</button>
      </div>
    </div>
    <div id="scanBanner" class="top-banner scan-banner" hidden>
      <span class="spinner-icon">⏳</span>
      <div class="banner-text-group">
        <span class="banner-title">Scanning Codebase via MCP</span>
        <span id="scanBannerDetail" class="banner-detail">Querying Hadrius frontend…</span>
      </div>
    </div>
  </div>

  <main id="recordingView">
    <section id="selectedWorkflow" class="selected" hidden></section>
    <section class="record-controls">
      <input id="scriptName" placeholder="Walkthrough name">
      <div class="record-button-row">
        <button id="recordBtn" class="primary" type="button">● Record</button>
        <button id="openSavedBtn" class="secondary" type="button" title="Load a saved walkthrough script to view, edit, or re-render">📂 Saved scripts</button>
        <button id="stopBtn" class="danger" type="button" hidden>■ Stop & draft narration</button>
        <button id="cancelRecordBtn" class="secondary" type="button" hidden>✕ Cancel recording</button>
        <button id="clearBtn" class="secondary" type="button">Clear</button>
      </div>
    </section>
    <div id="narrationStatus" class="notice" hidden></div>
    <section id="steps" class="steps"></section>
    <section class="footer-actions">
      <div class="render-buttons">
        <button id="renderBtn" class="primary" type="button">Render MP4</button>
        <button id="renderBothBtn" class="secondary" type="button" title="Render MP4 video and create a draft Pylon KB article">Render + Article</button>
        <button id="downloadBtn" class="secondary" type="button">Export script</button>
      </div>
      <div id="renderStatusRow" class="render-status-row" hidden>
        <div class="status-top">
          <span id="renderStatus" class="render-status-text"></span>
        </div>
        <div id="renderLinks" class="render-links" hidden>
          <a href="#" id="viewFinderLink" class="action-link">📂 View in Finder</a>
          <a href="#" id="pylonArticleLink" class="action-link pylon-link" target="_blank" rel="noopener noreferrer" hidden>↗ Open in Pylon</a>
          <button type="button" id="dismissResetBtn" class="dismiss-btn">✕ Dismiss & Reset</button>
        </div>
      </div>
    </section>
  </main>

  <main id="workflowsView" hidden>
    <section class="toolbar">
      <input id="search" type="search" placeholder="Search workflows and articles…">
      <button id="scanBtn" class="secondary">Scan codebase</button>
    </section>
    <p id="syncStatus" class="muted">Loading workflows and Pylon articles…</p>
    <div id="modules"></div>
    <footer id="workflowsFooter" class="workflows-footer">
      <span id="lastPylonSync" class="sync-timestamp">Last Pylon sync: --</span>
      <button id="refreshWorkflowsBtn" class="icon-btn refresh-btn" type="button" title="Refresh workflows and Pylon sync">
        <svg class="refresh-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2v4h-4"/>
          <path d="M2 14v-4h4"/>
          <path d="M13.5 10a5.5 5.5 0 0 1-9.3 2.3L2 10"/>
          <path d="M2.5 6a5.5 5.5 0 0 1 9.3-2.3L14 6"/>
        </svg>
      </button>
    </footer>
  </main>

  <div id="savedScriptsModal" class="modal-backdrop" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <h3>Saved Walkthroughs</h3>
          <span id="savedScriptsCount" class="badge">0</span>
        </div>
        <button id="closeSavedModalBtn" class="icon-btn close-btn" type="button" title="Close">✕</button>
      </div>
      <div class="modal-toolbar">
        <input id="savedScriptsSearch" type="search" placeholder="Search saved walkthroughs…">
        <label class="import-file-btn" title="Import a .script.json file from your computer">
          📥 Import
          <input type="file" id="scriptFileInput" accept=".json,.script.json" hidden>
        </label>
      </div>
      <div id="savedScriptsList" class="saved-scripts-list">
        <p class="muted small" style="padding: 16px; text-align: center;">Loading saved walkthroughs…</p>
      </div>
    </div>
  </div>

  <!-- Floating camera button for capturing UI screenshot -->
  <button id="floatingCameraBtn" class="floating-camera-btn" type="button" title="Capture screenshot of extension UI (Copies to clipboard & downloads) — Alt+S">
    <svg viewBox="0 0 24 24">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </button>

  <div id="toast" class="toast" hidden></div>

  <script src="html2canvas.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
