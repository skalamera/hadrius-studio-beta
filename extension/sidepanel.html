<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hadrius Studio Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header><img src="icons/wordmark.png" class="wordmark" alt="Hadrius Studio"><span class="beta-badge">Beta</span><span id="bridgeDot" class="dot"></span></header>
  <nav><button class="tab active" data-view="recording">Recording <span id="stepCount" hidden></span></button><button class="tab" data-view="workflows">Workflows</button></nav>

  <div id="statusBarContainer" class="top-status-container">
    <div id="recordingBanner" class="top-banner recording-banner" hidden>
      <span class="pulse-dot"></span>
      <div class="banner-text-group">
        <span class="banner-title">RECORDING LIVE</span>
        <span id="recordingStepIndicator" class="banner-detail">0 steps</span>
      </div>
    </div>
    <div id="scanBanner" class="top-banner scan-banner" hidden>
      <span class="spinner-icon">⏳</span>
      <div class="banner-text-group">
        <span class="banner-title">Scanning Codebase via MCP</span>
        <span id="scanBannerDetail" class="banner-detail">Querying Hadrius frontend…</span>
      </div>
    </div>
  </div>

  <main id="recordingView">
    <section id="selectedWorkflow" class="selected" hidden></section>
    <section class="record-controls">
      <input id="scriptName" placeholder="Walkthrough name">
      <div class="record-button-row">
        <button id="recordBtn" class="primary" type="button">● Record</button>
        <button id="stopBtn" class="danger" type="button" hidden>■ Stop & draft narration</button>
        <button id="cancelRecordBtn" class="secondary" type="button" hidden>✕ Cancel recording</button>
        <button id="clearBtn" class="secondary" type="button">Clear</button>
      </div>
    </section>
    <div id="narrationStatus" class="notice" hidden></div>
    <section id="steps" class="steps"></section>
    <section class="footer-actions">
      <div class="render-buttons">
        <button id="renderBtn" class="primary" type="button">Render MP4</button>
        <button id="renderBothBtn" class="secondary" type="button" title="Render MP4 video and create a draft Pylon KB article">Render + Article</button>
        <button id="downloadBtn" class="secondary" type="button">Export script</button>
      </div>
      <div id="renderStatusRow" class="render-status-row" hidden>
        <div class="status-top">
          <span id="renderStatus" class="render-status-text"></span>
        </div>
        <div id="renderLinks" class="render-links" hidden>
          <a href="#" id="viewFinderLink" class="action-link">📂 View in Finder</a>
          <a href="#" id="pylonArticleLink" class="action-link pylon-link" target="_blank" rel="noopener noreferrer" hidden>↗ Open in Pylon</a>
          <button type="button" id="dismissResetBtn" class="dismiss-btn">✕ Dismiss & Reset</button>
        </div>
      </div>
    </section>
  </main>

  <main id="workflowsView" hidden>
    <section class="toolbar">
      <input id="search" type="search" placeholder="Search workflows and articles…">
      <button id="scanBtn" class="secondary">Scan codebase</button>
    </section>
    <p id="syncStatus" class="muted">Loading workflows and Pylon articles…</p>
    <div id="modules"></div>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
